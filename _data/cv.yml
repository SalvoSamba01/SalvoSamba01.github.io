    Publications:
      - title: "SynthForensics: Benchmarking and Evaluating People-Centric Synthetic Video Deepfakes"
        authors:
          - "Roberto Leotta"
          - "Salvatore Alfio Sambataro"
          - "Claudio Vittorio Ragaglia"
          - "Mirko Casu"
          - "Yuri Petralia"
          - "Francesco Guarnera"
          - "Luca Guarnera"
          - "Sebastiano Battiato"
        journal: "Advances in Neural Information Processing Systems (NeurIPS 2026), Evaluations & Datasets Track - Poster"
        date: 2026-12
        url: https://arxiv.org/abs/2602.04939
        summary: "A people-centric benchmark for detecting synthetic video deepfakes: 20,445 videos from 8 text-to-video and 7 image-to-video open-source generators, paired with FF++/DFD real sources, two-stage human-validated and released in four compression versions with full metadata. Human raters prefer SynthForensics in 71-77% of head-to-head comparisons against nine existing synthetic-video benchmarks. Across 15 detectors and three protocols, face-based methods drop 13-55 AUC points (mean 27) from FF++ to SynthForensics, and a further 23 points under aggressive compression. Joint first authorship."

      - title: "Adversarial Attacks on Deepfake Detectors: A Challenge in the Era of AI-Generated Media"
        authors:
          - "Francesco Guarnera"
          - "Luca Guarnera"
          - "Andrea Montibeller"
          - "Salvatore Alfio Sambataro"
          - "Dario Samuele Pishvai"
          - "Ludovica Beritelli"
          - "Giovanni Puglisi"
          - "Zahid Akhtar"
          - "Giulia Boato"
          - "Sebastiano Battiato"
        journal: "Proceedings of the 34th ACM International Conference on Multimedia (ACM MM 2026)"
        date: 2026-11
        url: https://doi.org/10.1145/3767308.3837702
        summary: "AADD-2026, a competitive benchmark for evaluating adversarial attacks against deepfake detectors under realistic deployment conditions: synthetic images from five generative families, social-media-inspired processing, JPEG and JPEG-AI compression, and eight heterogeneous detectors. Ten teams submitted valid solutions; results show that accounting for compression and post-processing substantially improves transferability to unseen detectors, while DINOv2- and SigLIP2-based detectors are markedly more resilient."

