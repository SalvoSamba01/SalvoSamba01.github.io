      - "I am a PhD student in Artificial Intelligence and Computer Vision at the University of Catania, with a strong focus on synthetic media forensics and deepfake detection. Currently, I work at iCTLab s.r.l., an AI research lab, where I combine academic research with practical applications in machine learning and AI. My research interests include the development of robust detection systems for generative models and synthetic content, with emphasis on real-world applications and generalization across different domains."

